name: Package and Release MathDash

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package metadata
        id: version
        run: |
          # Use commit SHA short hash as version identifier
          VERSION=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Create package directory
        run: |
          mkdir -p package/mathdash

      - name: Copy application files to package
        run: |
          # Copy all necessary files
          cp index.html package/mathdash/
          cp app.js package/mathdash/
          cp styles.css package/mathdash/
          cp manifest.json package/mathdash/
          cp sw.js package/mathdash/
          cp README.md package/mathdash/

      - name: Create deployment instructions
        run: |
          cat > package/mathdash/DEPLOYMENT.md << 'EOF'
          # MathDash Deployment Instructions

          ## Overview
          MathDash is a Progressive Web App (PWA) for kids to practice multiplication tables. This package contains all files needed to deploy the application.

          ## Package Contents
          - `index.html` - Main application entry point
          - `app.js` - Application JavaScript logic
          - `styles.css` - Application styles
          - `manifest.json` - PWA manifest file
          - `sw.js` - Service Worker for offline functionality
          - `README.md` - Application documentation
          - `DEPLOYMENT.md` - This file

          ## Server Requirements

          ### Recommended Server Type: **Static Web Server**

          MathDash is a client-side PWA that requires only a static file server. No server-side processing, database, or backend is needed.

          #### Suitable Hosting Options:
          1. **GitHub Pages** (Free)
             - Perfect for this static PWA
             - Easy deployment via repository

          2. **Netlify** (Free tier available)
             - Automatic HTTPS
             - Easy drag-and-drop deployment

          3. **Vercel** (Free tier available)
             - Optimized for static sites
             - Simple deployment

          4. **Apache/Nginx** (Self-hosted)
             - Traditional web servers
             - Full control over configuration

          5. **AWS S3 + CloudFront** (Pay-as-you-go)
             - Scalable static hosting
             - CDN distribution

          6. **Azure Static Web Apps** (Free tier available)
             - Integrated with GitHub
             - Global distribution

          ### Minimum Server Requirements:
          - **HTTP Server**: Any web server capable of serving static files (HTML, CSS, JS)
          - **HTTPS**: Recommended for PWA features (service worker, install prompt)
          - **MIME Types**: Must support proper MIME types for:
            - `.html` → `text/html`
            - `.js` → `application/javascript` or `text/javascript`
            - `.css` → `text/css`
            - `.json` → `application/json`
          - **No Database**: Not required
          - **No Server-Side Processing**: Not required (PHP, Node.js, Python, etc.)

          ## Deployment Steps

          ### Option 1: GitHub Pages (Recommended for simplicity)

          1. Create a new GitHub repository or use existing one
          2. Upload all files from this package to the repository
          3. Go to repository Settings → Pages
          4. Select branch (usually `main`) and root directory
          5. Save and wait for deployment
          6. Access via `https://[username].github.io/[repository-name]/`

          ### Option 2: Netlify

          1. Sign up for a free Netlify account
          2. Drag and drop the entire package folder into Netlify dashboard
          3. Netlify will automatically deploy and provide a URL
          4. Optionally configure custom domain

          ### Option 3: Traditional Web Server (Apache/Nginx)

          #### Apache:
          ```bash
          # Copy files to web server directory
          sudo cp -r mathdash/* /var/www/html/mathdash/

          # Set proper permissions
          sudo chown -R www-data:www-data /var/www/html/mathdash/
          sudo chmod -R 755 /var/www/html/mathdash/
          ```

          Apache configuration (optional, in `.htaccess` or VirtualHost):
          ```apache
          # Enable HTTPS redirect (recommended for PWA)
          RewriteEngine On
          RewriteCond %{HTTPS} off
          RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

          # Set proper MIME types (usually default)
          AddType application/javascript .js
          AddType text/css .css
          AddType application/json .json
          ```

          #### Nginx:
          ```bash
          # Copy files to web server directory
          sudo cp -r mathdash/* /usr/share/nginx/html/mathdash/

          # Set proper permissions
          sudo chown -R nginx:nginx /usr/share/nginx/html/mathdash/
          sudo chmod -R 755 /usr/share/nginx/html/mathdash/
          ```

          Nginx configuration (in server block):
          ```nginx
          server {
              listen 80;
              server_name your-domain.com;

              # Redirect to HTTPS (recommended for PWA)
              return 301 https://$server_name$request_uri;
          }

          server {
              listen 443 ssl;
              server_name your-domain.com;

              # SSL configuration
              ssl_certificate /path/to/cert.pem;
              ssl_certificate_key /path/to/key.pem;

              root /usr/share/nginx/html/mathdash;
              index index.html;

              location / {
                  try_files $uri $uri/ /index.html;
              }

              # Set proper MIME types (usually default)
              types {
                  application/javascript js;
                  text/css css;
                  application/json json;
              }
          }
          ```

          ### Option 4: Node.js Development Server (for testing)

          ```bash
          # Install http-server globally
          npm install -g http-server

          # Navigate to package directory
          cd mathdash

          # Start server
          http-server -p 8000

          # Access at http://localhost:8000
          ```

          ### Option 5: Python Development Server (for testing)

          ```bash
          # Navigate to package directory
          cd mathdash

          # Python 3
          python3 -m http.server 8000

          # Access at http://localhost:8000
          ```

          ## Post-Deployment Verification

          1. **Access the application** via your deployment URL
          2. **Test PWA features**:
             - Open in Chrome/Edge/Safari
             - Look for "Install" or "Add to Home Screen" prompt
             - Test offline functionality (disconnect network and reload)
          3. **Test game functionality**:
             - Choose a multiplication table
             - Complete a game
             - Verify all screens work correctly
          4. **Check browser console** for any errors

          ## PWA Installation

          Once deployed with HTTPS, users can install MathDash as a PWA:

          - **Desktop**: Look for install icon in address bar or browser menu
          - **Mobile**: Use "Add to Home Screen" option in browser menu
          - **Installed app**: Works offline and appears like a native app

          ## Troubleshooting

          ### Service Worker not registering
          - Ensure HTTPS is enabled (required for service workers)
          - Check browser console for errors
          - Verify `sw.js` file is accessible

          ### Files not loading
          - Check file permissions (755 for directories, 644 for files)
          - Verify MIME types are configured correctly
          - Check web server error logs

          ### PWA install prompt not showing
          - HTTPS is required
          - manifest.json must be valid
          - Service worker must register successfully
          - User must interact with the page first

          ## Security Considerations

          - **Always use HTTPS** in production for PWA features and security
          - No sensitive data is stored or transmitted
          - Application runs entirely client-side
          - No authentication or backend API calls

          ## Performance Tips

          - Enable gzip compression on web server for faster loading
          - Use CDN for global distribution
          - Cache static files with appropriate headers
          - Service worker provides offline caching automatically

          ## Support

          For issues or questions, refer to the main README.md or open an issue on the GitHub repository.

          ## License

          MIT License - See README.md for details
          EOF

      - name: Create package archive
        run: |
          cd package
          zip -r mathdash-${{ steps.version.outputs.version }}.zip mathdash/
          cd ..

      - name: Upload package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathdash-package-${{ steps.version.outputs.version }}
          path: package/mathdash-${{ steps.version.outputs.version }}.zip
          retention-days: 90

      - name: Create deployment summary
        run: |
          echo "## 📦 MathDash Package Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Package version: \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Package Contents:" >> $GITHUB_STEP_SUMMARY
          echo "- index.html" >> $GITHUB_STEP_SUMMARY
          echo "- app.js" >> $GITHUB_STEP_SUMMARY
          echo "- styles.css" >> $GITHUB_STEP_SUMMARY
          echo "- manifest.json" >> $GITHUB_STEP_SUMMARY
          echo "- sw.js" >> $GITHUB_STEP_SUMMARY
          echo "- README.md" >> $GITHUB_STEP_SUMMARY
          echo "- DEPLOYMENT.md" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Server Requirements:" >> $GITHUB_STEP_SUMMARY
          echo "- **Type**: Static web server (Apache, Nginx, GitHub Pages, Netlify, etc.)" >> $GITHUB_STEP_SUMMARY
          echo "- **HTTPS**: Recommended for PWA features" >> $GITHUB_STEP_SUMMARY
          echo "- **No backend required**: Pure client-side PWA" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 Download the package artifact from this workflow run to deploy." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📖 See DEPLOYMENT.md in the package for detailed deployment instructions." >> $GITHUB_STEP_SUMMARY
